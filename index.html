<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>製品サポートFAQ | Product Support FAQ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand" id="brand"></div>
      <label class="lang-select">
        <span id="lang-label"></span>
        <select id="lang">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
      </label>
    </div>
  </header>

  <nav class="breadcrumb" aria-label="breadcrumb">
    <div class="container" id="breadcrumb"></div>
  </nav>

  <section class="hero">
    <div class="container">
      <h1 id="site-title"></h1>
      <p id="site-desc" class="hero-desc"></p>
      <div class="search-box">
        <input type="search" id="search" maxlength="100" autocomplete="off">
      </div>
    </div>
  </section>

  <main class="container">
    <section aria-labelledby="tiles-heading">
      <h2 id="tiles-heading" class="section-title"></h2>
      <div id="tiles" class="tiles"></div>
      <div id="subtiles" class="tiles subtiles" hidden></div>
    </section>

    <section class="filters" aria-label="filters">
      <label>
        <span id="region-label"></span>
        <select id="region"></select>
      </label>
      <label>
        <span id="topic-label"></span>
        <select id="topic"></select>
      </label>
    </section>

    <h2 id="result-heading" class="section-title"></h2>
    <p id="count" class="count" aria-live="polite"></p>
    <section id="faq-list" class="faq-list"></section>
    <p id="empty" class="empty" hidden></p>
    <p id="error" class="error" role="alert" hidden></p>
  </main>

  <footer class="site-footer">
    <div class="container" id="footer-text"></div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
